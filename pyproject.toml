[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fia-fashion-intelligence"
version = "0.1.0"
description = "India-first fashion product research agent"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0", "sqlalchemy>=2.0,<3.0", "pydantic>=2.6,<3.0", "pydantic-settings>=2.2,<3.0", "httpx>=0.27,<1.0", "beautifulsoup4>=4.12,<5.0", "lxml>=5.1,<6.0", "python-dotenv>=1.0,<2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.4,<1.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
